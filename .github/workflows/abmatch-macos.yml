name: ABmatch macOS (10.13 High Sierra)

# Builds the plug-in on pushes and pull requests that touch its sources.
# The build itself lives in abmatch-build.yml, which the release workflow
# (abmatch-release.yml) calls too.

on:
  workflow_dispatch:
    inputs:
      xcode_version:
        description: >-
          Xcode to build with. 14.3.1 is the toolchain known to produce
          binaries that launch on High Sierra; hosted runners no longer ship
          it, so they fall back to the oldest Xcode 14-16 they have.
        required: false
        default: "14.3.1"
  push:
    branches: [main]
    paths:
      - "Source/**"
      - "CMakeLists.txt"
      - "build-macos.sh"
      - ".github/workflows/abmatch-macos.yml"
      - ".github/workflows/abmatch-build.yml"
      - ".github/workflows/abmatch-release.yml"
  pull_request:
    paths:
      - "Source/**"
      - "CMakeLists.txt"
      - "build-macos.sh"
      - ".github/workflows/abmatch-macos.yml"
      - ".github/workflows/abmatch-build.yml"
      - ".github/workflows/abmatch-release.yml"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/abmatch-build.yml
    with:
      xcode_version: ${{ inputs.xcode_version || '14.3.1' }}
