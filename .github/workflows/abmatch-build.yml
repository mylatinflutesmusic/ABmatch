name: ABmatch macOS build

# Reusable build: High Sierra compatible VST3, x86_64 only (10.13 is
# Intel-only) with a 10.13 deployment target. The resulting Mach-O is checked
# before the bundle is uploaded. Called by abmatch-macos.yml (push/PR) and
# abmatch-release.yml (tags).

on:
  workflow_call:
    inputs:
      xcode_version:
        description: >-
          Xcode to build with. 14.3.1 is the toolchain known to produce
          binaries that launch on High Sierra; hosted runners no longer ship
          it, so they fall back to the oldest Xcode 14-16 they have.
        required: false
        type: string
        default: "14.3.1"
    outputs:
      xcode_version:
        description: Xcode version actually used
        value: ${{ jobs.build.outputs.xcode_version }}
      artifact_name:
        description: Name of the uploaded artifact
        value: ABmatch-vst3-macos10.13-x86_64

permissions:
  contents: read

jobs:
  build:
    name: VST3 x86_64 / macOS 10.13
    # Intel image: the build is native x86_64 and GitHub keeps this label
    # until August 2027. arm64 images can cross-compile, but the Intel image
    # avoids relying on that.
    runs-on: macos-15-intel
    timeout-minutes: 60
    outputs:
      xcode_version: ${{ steps.xcode.outputs.version }}
    env:
      DEPLOYMENT_TARGET: "10.13"
      ARCHS: "x86_64"
      REQUESTED_XCODE: ${{ inputs.xcode_version }}
      BUILD_DIR: build-macos

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Select Xcode
        id: xcode
        run: |
          set -euo pipefail

          echo "Available Xcodes:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo "Requested: $REQUESTED_XCODE"

          chosen=""

          # Oldest first: the older the toolchain, the better the odds that the
          # output still launches on 10.13. Never pick 26/27, which drop support
          # for deployment targets below macOS 12.
          for candidate in 14.3.1 14.3 14.2 14.1 14.0.1 14.0 \
                           15.4 15.3 15.2 15.1 15.0.1 15.0 \
                           16.0 16.1 16.2 16.3 16.4; do
            if [ -d "/Applications/Xcode_${candidate}.app" ]; then
              chosen="/Applications/Xcode_${candidate}.app"
              break
            fi
          done

          if [ -z "$chosen" ] && [ -d "/Applications/Xcode_${REQUESTED_XCODE}.app" ]; then
            chosen="/Applications/Xcode_${REQUESTED_XCODE}.app"
          fi

          if [ -z "$chosen" ]; then
            echo "::error::No Xcode 14, 15 or 16 found. Xcode 26/27 cannot target macOS 10.13."
            exit 1
          fi

          sudo xcode-select --switch "$chosen"
          version=$(xcodebuild -version | awk 'NR==1 {print $2}')
          echo "Using Xcode $version ($chosen)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          case "$version" in
            16.*)
              echo "::warning::Only Xcode $version is available here. Builds made with Xcode 15/16 and a modern SDK have been reported to fail on 10.13-10.15 even with the correct deployment target; test this artifact on a real High Sierra machine before shipping it."
              ;;
          esac

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$DEPLOYMENT_TARGET" \
            -DCMAKE_OSX_ARCHITECTURES="$ARCHS"

      - name: Build VST3
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" --config Release --target ABmatch_VST3 \
            --parallel "$(sysctl -n hw.ncpu)"

      - name: Verify binary targets macOS 10.13 / x86_64
        run: |
          set -euo pipefail

          BUNDLE="$BUILD_DIR/ABmatch_artefacts/Release/VST3/ABmatch.vst3"

          if [ ! -d "$BUNDLE" ]; then
            echo "::error::VST3 bundle is missing at $BUNDLE"
            exit 1
          fi

          BINARY="$BUNDLE/Contents/MacOS/ABmatch"

          if [ ! -f "$BINARY" ]; then
            BINARY=$(find "$BUNDLE/Contents/MacOS" -type f -perm -u+x | head -1)
          fi

          if [ -z "${BINARY:-}" ] || [ ! -f "$BINARY" ]; then
            echo "::error::No plug-in binary inside $BUNDLE"
            exit 1
          fi

          echo "binary: $BINARY"

          {
            echo "### ABmatch VST3 - macOS $DEPLOYMENT_TARGET, $ARCHS"
            echo
            echo "- Xcode: \`$(xcodebuild -version | head -1)\`"
            echo "- Bundle: \`$BUNDLE\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "=== lipo ==="
          archs=$(lipo -archs "$BINARY")
          echo "$archs"
          {
            echo "- Architectures: \`$archs\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$archs" != "$ARCHS" ]; then
            echo "::error::Expected only $ARCHS, got: $archs"
            exit 1
          fi

          LOAD_COMMANDS=$(otool -l "$BINARY")

          echo "=== minimum OS ==="
          MINOS=$(printf '%s\n' "$LOAD_COMMANDS" \
            | awk '/LC_BUILD_VERSION/ {inbuild=1} inbuild && /minos/ {print $2; exit}')
          if [ -z "${MINOS:-}" ]; then
            MINOS=$(printf '%s\n' "$LOAD_COMMANDS" \
              | awk '/LC_VERSION_MIN_MACOSX/ {found=1} found && /version/ {print $2; exit}')
          fi
          echo "minos: ${MINOS:-unknown}"
          {
            echo "- Minimum OS: \`${MINOS:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${MINOS:-}" != "$DEPLOYMENT_TARGET" ]; then
            echo "::error::Binary targets macOS ${MINOS:-unknown}, expected $DEPLOYMENT_TARGET"
            exit 1
          fi

          echo "=== load commands ==="
          vtool -show-build "$BINARY" 2>/dev/null || echo "(vtool unavailable)"

          if printf '%s\n' "$LOAD_COMMANDS" | grep -q LC_DYLD_CHAINED_FIXUPS; then
            echo "::error::Binary uses chained fixups, which the High Sierra dyld cannot load"
            exit 1
          fi

          if plutil -p "$BUNDLE/Contents/Info.plist" | grep -q LSMinimumSystemVersion; then
            PLIST_MIN=$(plutil -extract LSMinimumSystemVersion raw "$BUNDLE/Contents/Info.plist")
            echo "Info.plist LSMinimumSystemVersion: $PLIST_MIN"
            {
              echo "- Info.plist minimum: \`$PLIST_MIN\`"
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "$PLIST_MIN" != "$DEPLOYMENT_TARGET" ]; then
              echo "::warning::Info.plist advertises macOS $PLIST_MIN instead of $DEPLOYMENT_TARGET"
            fi
          fi

      - name: Sign and package
        run: |
          set -euo pipefail

          BUNDLE="$BUILD_DIR/ABmatch_artefacts/Release/VST3/ABmatch.vst3"

          codesign --force --deep --sign - "$BUNDLE"
          codesign --verify --verbose=2 "$BUNDLE"

          ditto -c -k --sequesterRsrc --keepParent "$BUNDLE" \
            "ABmatch-vst3-macos${DEPLOYMENT_TARGET}-${ARCHS}.zip"

          ls -lh "ABmatch-vst3-macos${DEPLOYMENT_TARGET}-${ARCHS}.zip"

      - name: Upload VST3
        uses: actions/upload-artifact@v7
        with:
          name: ABmatch-vst3-macos10.13-x86_64
          path: ABmatch-vst3-macos10.13-x86_64.zip
          if-no-files-found: error
          retention-days: 30
