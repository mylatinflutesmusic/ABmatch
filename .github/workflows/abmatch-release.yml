name: ABmatch release (macOS 10.13)

# Push a tag (for example v1.4.0) to build the High Sierra VST3 and attach it
# to a GitHub Release, together with a SHA256 checksum file. Release assets do
# not expire, so the download link stays valid instead of dropping off after
# the 30-day artifact retention.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/abmatch-build.yml

  release:
    name: Attach VST3 to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download VST3 bundle
        uses: actions/download-artifact@v8
        with:
          name: ABmatch-vst3-macos10.13-x86_64
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          ASSET="ABmatch-vst3-macos10.13-x86_64.zip"

          if [ ! -f "dist/$ASSET" ]; then
            echo "::error::Artifact does not contain $ASSET"
            ls -R dist
            exit 1
          fi

          XCODE=$(sed -n 's/^xcode=//p' dist/build-info.txt 2>/dev/null || true)
          XCODE=${XCODE:-unknown}

          # Checksum file published next to the zip.
          ( cd dist && shasum -a 256 "$ASSET" > "$ASSET.sha256" && cat "$ASSET.sha256" )

          # Release notes. Quoted heredoc: no shell expansion, so the fenced
          # blocks below reach GitHub untouched.
          cat > notes.md <<'EOF'
          macOS 10.13 (High Sierra) VST3, x86_64 only.

          Unzip and copy ABmatch.vst3 to `~/Library/Audio/Plug-Ins/VST3`, then rescan plug-ins in your host.

          ### Ad-hoc signed, not notarised

          The plug-in is ad-hoc signed, not signed with an Apple Developer ID and not notarised. macOS may quarantine the download, so the host can ignore or refuse the plug-in until you allow it:

          - High Sierra: System Preferences > Security & Privacy > General, then click **Open Anyway** for ABmatch.
          - Newer macOS: System Settings > Privacy & Security, then **Open Anyway**.

          Or clear the quarantine flag on the installed bundle:

          ```
          xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/ABmatch.vst3
          ```

          ### Verify the download

          The zip's SHA256 is published next to it as `ABmatch-vst3-macos10.13-x86_64.zip.sha256`:

          ```
          shasum -a 256 -c ABmatch-vst3-macos10.13-x86_64.zip.sha256
          ```
          EOF

          printf '\nBuilt and checked in CI: architectures x86_64 only, minimum OS 10.13, no chained fixups. Built with Xcode %s.\n' "$XCODE" >> notes.md

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/$ASSET#ABmatch-vst3-macos10.13-x86_64.zip" \
              "dist/$ASSET.sha256#ABmatch-vst3-macos10.13-x86_64.zip.sha256" \
              --repo "$GH_REPO" --clobber
            gh release edit "$TAG" --repo "$GH_REPO" --notes-file notes.md
          else
            gh release create "$TAG" \
              "dist/$ASSET#ABmatch-vst3-macos10.13-x86_64.zip" \
              "dist/$ASSET.sha256#ABmatch-vst3-macos10.13-x86_64.zip.sha256" \
              --repo "$GH_REPO" \
              --title "ABmatch ${TAG} - macOS 10.13 (x86_64)" \
              --notes-file notes.md
          fi

          echo
          echo "Release: $(gh release view "$TAG" --repo "$GH_REPO" --json url --jq .url)"
          gh release view "$TAG" --repo "$GH_REPO" --json assets \
            --jq '.assets[] | "asset: " + .name + " (" + (.size|tostring) + " bytes)"'
